<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posting Notifier</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1a1d23;--mut:#6b7280;--line:#e5e7eb;--acc:#2563eb;--accfg:#fff;
  --saved:#d97706;--applied:#16a34a;--new:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--fg:#e6e8ec;--mut:#8b93a1;--line:#272b35;--acc:#3b82f6}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0 12px 0 0}
input,select,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{flex:1;min-width:200px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button:disabled{opacity:.6;cursor:default}
.tabs button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:16px 20px 80px}
.count{color:var(--mut);margin:4px 0 12px}
.job{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:8px}
.job.applied{border-left:4px solid var(--applied)}.job.saved{border-left:4px solid var(--saved)}
.body{flex:1;min-width:0}
.title{font-weight:600;color:var(--fg);text-decoration:none}.title:hover{color:var(--acc);text-decoration:underline}
.meta{color:var(--mut);margin-top:2px;font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--new);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.acts{display:flex;gap:6px;flex-shrink:0}
.acts button{padding:4px 9px;font-size:12px}
.acts button.on.saved{background:var(--saved);border-color:var(--saved);color:#fff}
.acts button.on.applied{background:var(--applied);border-color:var(--applied);color:#fff}
.empty{text-align:center;color:var(--mut);padding:50px 0}
#panel{position:fixed;right:16px;bottom:16px;width:min(460px,calc(100vw - 32px));background:var(--card);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px #0004;display:none}
#panel header{position:static;border:0;padding:10px 14px;display:flex;justify-content:space-between}
#log{margin:0;padding:0 14px 12px;max-height:240px;overflow:auto;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;color:var(--mut)}
label.chk{display:flex;gap:5px;align-items:center;color:var(--mut)}
.pill{color:var(--mut);font-size:13px}
@media(max-width:640px){.job{flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Posting Notifier</h1>
    <input id="q" type="search" placeholder="Search title, company, location…">
    <select id="when">
      <option value="0">Any time</option>
      <option value="24">Last 24 hours</option>
      <option value="72">Last 3 days</option>
      <option value="168">Last 7 days</option>
      <option value="720">Last 30 days</option>
    </select>
    <select id="company"><option value="">All companies</option></select>
    <select id="sort"><option value="posted">Newest first</option><option value="company">Company A–Z</option></select>
  </div>
  <div class="row" style="margin-top:10px;justify-content:space-between">
    <div class="row tabs" id="tabs">
      <button data-t="open" class="on">Open</button>
      <button data-t="saved">Saved</button>
      <button data-t="applied">Applied</button>
      <button data-t="hidden">Hidden</button>
      <button data-t="all">All</button>
    </div>
    <div class="row">
      <span class="pill" id="crawlpill"></span>
      <label class="chk"><input type="checkbox" id="auto"> auto-crawl</label>
      <button class="primary" id="crawlbtn">Crawl now</button>
      <button id="logbtn">Log</button>
    </div>
  </div>
</header>
<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<div id="panel">
  <header><b>Crawl log</b><button onclick="panel.style.display='none'">✕</button></header>
  <pre id="log"></pre>
</div>
<script>
const $ = id => document.getElementById(id);
const panel = $('panel');
let jobs = [], tab = 'open', wasRunning = false;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  if (isNaN(s)) return '';
  if (s < 3600) return Math.max(1, Math.round(s/60)) + 'm ago';
  if (s < 86400) return Math.round(s/3600) + 'h ago';
  if (s < 86400*30) return Math.round(s/86400) + 'd ago';
  return iso.slice(0,10);
}

async function load(){
  jobs = (await (await fetch('/api/jobs')).json()).jobs;
  const sel = $('company'), cur = sel.value;
  const names = [...new Set(jobs.map(j => j.company))].sort((a,b) => a.localeCompare(b));
  sel.innerHTML = '<option value="">All companies ('+names.length+')</option>' +
    names.map(n => `<option>${esc(n)}</option>`).join('');
  sel.value = names.includes(cur) ? cur : '';
  render();
}

function render(){
  const q = $('q').value.trim().toLowerCase(), hrs = +$('when').value, co = $('company').value;
  const cutoff = hrs ? Date.now() - hrs*3600e3 : 0;
  let rows = jobs.filter(j => {
    const st = j.status || '';
    if (tab === 'open' && st === 'hidden') return false;
    if (tab !== 'open' && tab !== 'all' && st !== tab) return false;
    if (co && j.company !== co) return false;
    if (cutoff && new Date(j.posted) < cutoff) return false;
    if (q && !(j.title + ' ' + j.company + ' ' + j.location).toLowerCase().includes(q)) return false;
    return true;
  });
  if ($('sort').value === 'company')
    rows.sort((a,b) => a.company.localeCompare(b.company) || a.title.localeCompare(b.title));
  $('count').textContent = `${rows.length} of ${jobs.length} matching jobs`;
  const shown = rows.slice(0, 300);
  $('list').innerHTML = shown.length ? shown.map(j => {
    const fresh = Date.now() - new Date(j.posted) < 86400e3;
    const st = j.status || '';
    return `<div class="job ${st}">
      <div class="body">
        <a class="title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>${fresh ? '<span class="badge">NEW</span>' : ''}
        <div class="meta"><b>${esc(j.company)}</b>${j.location ? ' · ' + esc(j.location) : ''} · posted ${ago(j.posted)}</div>
      </div>
      <div class="acts">
        <button class="saved ${st==='saved'?'on':''}" data-id="${j.id}" data-s="saved">★ Save</button>
        <button class="applied ${st==='applied'?'on':''}" data-id="${j.id}" data-s="applied">✓ Applied</button>
        <button data-id="${j.id}" data-s="hidden">${st==='hidden'?'Unhide':'Hide'}</button>
      </div></div>`;
  }).join('') + (rows.length > shown.length ? `<div class="empty">Showing first ${shown.length}. Narrow the filters to see more.</div>` : '')
  : '<div class="empty">No jobs match these filters.</div>';
}

$('list').onclick = async e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  const j = jobs.find(x => x.id === b.dataset.id), s = b.dataset.s;
  j.status = j.status === s ? null : s;
  render();
  fetch('/api/status', {method:'POST', body: JSON.stringify({id: j.id, status: j.status})});
};
$('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.t;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
};
['q','when','company','sort'].forEach(id => $(id).addEventListener('input', render));

$('crawlbtn').onclick = async () => { panel.style.display = 'block'; await fetch('/api/crawl', {method:'POST', body:'{}'}); poll(); };
$('logbtn').onclick = () => panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
$('auto').onchange = e => fetch('/api/auto', {method:'POST', body: JSON.stringify({auto: e.target.checked})});

async function poll(){
  const s = await (await fetch('/api/crawl')).json();
  $('crawlbtn').disabled = s.running;
  $('crawlbtn').textContent = s.running ? 'Crawling…' : 'Crawl now';
  $('auto').checked = s.auto;
  const log = $('log'), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.textContent = s.log.join('\n');
  if (atBottom) log.scrollTop = log.scrollHeight;
  let pill = s.running ? 'crawling…' : s.last_run ? `last crawl ${ago(s.last_run)}` + (s.last_new != null ? ` · ${s.last_new} new` : '') : '';
  if (s.auto && s.next_in != null && !s.running) pill += ` · next in ${Math.ceil(s.next_in/60)}m`;
  $('crawlpill').textContent = pill;
  if (wasRunning && !s.running) load();
  wasRunning = s.running;
}
load(); poll(); setInterval(poll, 1500);
</script>
</body>
</html>
