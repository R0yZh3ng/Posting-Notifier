# Posting Notifier configuration.
# Copy to config.local.yaml (gitignored) if you want to keep private keys out of git;
# config.local.yaml is loaded in preference to this file when it exists.

poll_interval_minutes: 30

# A job matches when its title:
#   - contains ANY of `include`           (e.g. it's an intern role)
#   - AND contains ANY of `require`       (e.g. it's a software / quant role) -- leave empty to skip
#   - AND contains NONE of `exclude`
#   - AND, if `locations` is non-empty, title+location contains ANY of them.
# Patterns are case-insensitive regexes matched on whole words.
criteria:
  include:
    - "intern"
    - "internship"
    - "co-?op"
    - "new grad(uate)?"
    - "early career"
    - "summer analyst"
    - "campus"
    - "university"
    - "summer 20\\d\\d"
    - "winter 20\\d\\d"
    - "fall 20\\d\\d"
    - "spring 20\\d\\d"
  require:
    - "software"
    - "swe"
    - "sde"
    - "engineer(ing)?"
    - "developer"
    - "quant(itative)?"
    - "trad(er|ing)"
    - "research(er)?"
    - "machine learning"
    - "ml"
    - "ai"
    - "data"
    - "infrastructure"
    - "platform"
    - "backend"
    - "front ?end"
    - "full[- ]?stack"
    - "systems"
    - "security"
    - "compiler"
    - "kernel"
    - "robotics"
    - "autonomy"
    - "perception"
    - "technology"
    - "technical"
    - "programmer"
    - "computer science"
    - "strats?"
  exclude:
    - "marketing"
    - "sales"
    - "recruit(er|ing)"
    - "people"
    - "hr"
    - "legal"
    - "accountant|accounting"
    - "account (executive|manager)"
    - "mechanical"
    - "electrical"
    - "civil"
    - "manufacturing"
    - "supply chain"
    - "propulsion|process|industrial(ization)?|structural|thermal|materials|chemical|biomedical|quality"
    - "hardware|pcb|rf|analog|asic|silicon|physical design|layout|packaging|test engineer"
    - "communications"
    - "customer success"
    - "support"
    - "nurse|clinical|pharmac"
    - "mba"
    - "senior|staff|principal|director|manager|lead|head of"
  locations: []          # e.g. ["remote", "san francisco", "new york", "toronto"]

# Where to send notifications. All enabled channels fire for each new match.
notify:
  desktop: true          # macOS notification via osascript
  webhook: ""            # Slack / Discord incoming webhook URL
  ntfy:                  # free phone push, no account: install the ntfy app, subscribe to this topic
    topic: ""            # pick something unguessable, e.g. "posting-notifier-8f3k29xq" (it acts as the password)
  email:                 # one digest email per crawl that finds new matches
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587       # 587 = STARTTLS, 465 = SSL
    username: ""         # e.g. you@gmail.com
    password: ""         # Gmail needs an app password. Better: put it in config.local.yaml
                         # or the POSTING_NOTIFIER_SMTP_PASSWORD env var, not here.
    from: ""             # defaults to username
    to: ""               # where to deliver (can be the same address)

# Output files
output:
  markdown: jobs.md            # every current match
  html: jobs.html
  recent:                      # extra lists limited to recently posted jobs
    - hours: 24
      label: Posted in the last 24 hours
      markdown: jobs-24h.md
      html: jobs-24h.html
    - hours: 72
      label: Posted in the last 3 days
      markdown: jobs-3d.md
      html: jobs-3d.html

