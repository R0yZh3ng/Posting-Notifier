# Posting Notifier configuration.
# Copy to config.local.yaml (gitignored) if you want to keep private keys out of git;
# config.local.yaml is loaded in preference to this file when it exists.

poll_interval_minutes: 30

# A job matches when its title contains ANY of `include` (case-insensitive, regex ok)
# and NONE of `exclude`. `locations` (optional) must match title or location field.
criteria:
  include:
    - "software engineer"
    - "swe"
    - "backend"
    - "full[- ]?stack"
    - "new grad"
    - "intern"
  exclude:
    - "senior"
    - "staff"
    - "principal"
    - "manager"
    - "director"
  locations: []          # e.g. ["remote", "san francisco", "new york", "toronto"]

# Where to send notifications. All enabled channels fire for each new match.
notify:
  desktop: true          # macOS notification via osascript
  webhook: ""            # Slack / Discord incoming webhook URL (posts {"text": ..., "content": ...})

# Output files
output:
  markdown: jobs.md
  html: jobs.html

# Companies to watch.
#   type: greenhouse | lever | ashby | workable | smartrecruiters | html
#   slug: the company's board identifier on that ATS (visible in its careers URL)
#   For `html`, give `url` plus a CSS `selector` for <a> job links (default "a[href]")
#   and optionally `pattern`, a regex the href must match.
companies:
  - name: Stripe
    type: greenhouse
    slug: stripe
  - name: Cloudflare
    type: greenhouse
    slug: cloudflare
  - name: Figma
    type: greenhouse
    slug: figma
  - name: Anthropic
    type: greenhouse
    slug: anthropic
  - name: Databricks
    type: greenhouse
    slug: databricks
  - name: Plaid
    type: ashby
    slug: plaid
  - name: Ramp
    type: ashby
    slug: ramp
  - name: Notion
    type: ashby
    slug: notion
  - name: Vercel
    type: greenhouse
    slug: vercel
  # Example of a custom careers page scraped from HTML:
  # - name: Example Co
  #   type: html
  #   url: https://example.com/careers
  #   selector: "a.job-link"
  #   pattern: "/jobs/\\d+"
